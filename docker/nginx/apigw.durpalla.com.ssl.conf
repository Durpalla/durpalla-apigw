# HTTPS site for apigw.durpalla.com (Cloudflare Full / Full Strict).
# Install once: script/setup-apigw-cloudflare-ssl.sh
#
# Requires shared cert files (wildcard *.durpalla.com):
#   /opt/durpalla/durpalla-cert.pem
#   /opt/durpalla/durpalla-key.pem
#   upstream apigw_durpalla (see upstream.conf)

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apigw.durpalla.com;

    ssl_certificate     /opt/durpalla/durpalla-cert.pem;
    ssl_certificate_key /opt/durpalla/durpalla-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    access_log /var/log/nginx/apigw.durpalla.com.access.log;
    error_log /var/log/nginx/apigw.durpalla.com.error.log warn;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://apigw_durpalla;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
