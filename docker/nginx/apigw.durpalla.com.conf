# Site config for apigw.durpalla.com
# Install: ./script/setup-host-nginx.sh
#
# Requires upstream apigw_durpalla (see upstream.conf).

server {
    listen 80;
    listen [::]:80;
    server_name apigw.durpalla.com;

    client_max_body_size 20M;

    access_log /var/log/nginx/apigw.durpalla.com.access.log;
    error_log /var/log/nginx/apigw.durpalla.com.error.log warn;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://apigw_durpalla;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
