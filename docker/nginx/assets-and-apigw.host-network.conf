# Host-network nginx for servers without host nginx (.94).
# Serves assets.durpalla.com (CDN) and apigw.durpalla.com (API gateway).
# Install: ./script/setup-host-network-nginx.sh

map $http_x_forwarded_proto $apigw_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream apigw_durpalla {
    least_conn;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8003 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8004 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

upstream assets_admin_app {
    server 127.0.0.1:8080;
    keepalive 8;
}

map $http_referer $assets_referer_ok {
    default                         0;
    ""                              1;
    "~^https?://([^/]+\.)?durpalla\.com(/|:|$)" 1;
    "~^https?://localhost"          1;
    "~^http://localhost"            1;
    "~^https?://127\.0\.0\.1"       1;
    "~^http://127\.0\.0\.1"          1;
}

server {
    listen 80;
    listen [::]:80;
    server_name apigw.durpalla.com;

    client_max_body_size 20M;

    access_log /var/log/nginx/apigw.durpalla.com.access.log;
    error_log /var/log/nginx/apigw.durpalla.com.error.log warn;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://apigw_durpalla;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $apigw_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name assets.durpalla.com;

    client_max_body_size 64M;

    access_log /var/log/nginx/assets.durpalla.com.access.log;
    error_log /var/log/nginx/assets.durpalla.com.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location ~ ^/(default|css|js|fonts|vendor)/.+\.[A-Za-z0-9]+$ {
        if ($assets_referer_ok = 0) { return 403; }
        proxy_pass http://assets_admin_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ~ ^/storage/(.+\.[A-Za-z0-9]+)$ {
        if ($assets_referer_ok = 0) { return 403; }
        alias /mnt/durpalla-assets/storage/$1;
    }

    location ~ ^/uploads/(.+\.[A-Za-z0-9]+)$ {
        if ($assets_referer_ok = 0) { return 403; }
        alias /mnt/durpalla-assets/uploads/$1;
    }

    location ~ ^/nid/(.+\.[A-Za-z0-9]+)$ {
        if ($assets_referer_ok = 0) { return 403; }
        alias /mnt/durpalla-assets/nid/$1;
    }

    location ~ ^/images/(.+\.[A-Za-z0-9]+)$ {
        if ($assets_referer_ok = 0) { return 403; }
        alias /mnt/durpalla-assets/images/$1;
    }

    location ~ ^/vehicles/(.+\.[A-Za-z0-9]+)$ {
        if ($assets_referer_ok = 0) { return 403; }
        alias /mnt/durpalla-assets/vehicles/$1;
    }

    location ~ ^/qrs/(.+\.[A-Za-z0-9]+)$ {
        if ($assets_referer_ok = 0) { return 403; }
        alias /mnt/durpalla-assets/qrs/$1;
    }

    location = / {
        default_type text/plain;
        return 403 'Access denied';
    }

    location / {
        default_type text/plain;
        return 403 'Access denied';
    }
}
