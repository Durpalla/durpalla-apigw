# Same as docker-compose.prod.yml (4 containers on 8001–8004).

x-apigw-common: &apigw-common
  build:
    context: .
    dockerfile: Dockerfile
  image: durpalla-apigw-app:local
  restart: unless-stopped
  env_file:
    - ${APIGW_ENV_FILE:-.env}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - apigw-storage:/var/www/html/storage
    - apigw-bootstrap-cache:/var/www/html/bootstrap/cache
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 40s

services:
  apigw-1:
    <<: *apigw-common
    container_name: durpalla-apigw-1
    environment:
      APIGW_PRIMARY: "1"
    ports:
      - "${APIGW_PORT_1:-8001}:80"

  apigw-2:
    <<: *apigw-common
    container_name: durpalla-apigw-2
    ports:
      - "${APIGW_PORT_2:-8002}:80"

  apigw-3:
    <<: *apigw-common
    container_name: durpalla-apigw-3
    ports:
      - "${APIGW_PORT_3:-8003}:80"

  apigw-4:
    <<: *apigw-common
    container_name: durpalla-apigw-4
    ports:
      - "${APIGW_PORT_4:-8004}:80"

volumes:
  apigw-storage:
  apigw-bootstrap-cache:
