name: CI — Build & Deploy

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jewel-rana/durpalla-apigw

concurrency:
  group: deploy-apigw-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev-{{date 'YYYYMMDD'}}-{{sha}},enable=true
            type=raw,value=dev-latest,enable=true
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "### Image pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | ${{ steps.build.outputs.digest }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to ${{ matrix.server.name }}
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        server:
          - name: server-1
            host: 103.60.204.94
          - name: server-2
            host: 103.60.204.200
          - name: server-3
            host: 103.60.204.238

    concurrency:
      group: deploy-apigw-${{ github.ref }}-${{ matrix.server.host }}
      cancel-in-progress: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          missing=0
          [[ -n "${{ secrets.DEPLOY_USER }}" ]] || { echo "::error::Missing secret DEPLOY_USER"; missing=1; }
          [[ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]] || { echo "::error::Missing secret DEPLOY_SSH_KEY"; missing=1; }
          [[ -n "${{ secrets.GHCR_PULL_TOKEN }}" ]] || { echo "::error::Missing secret GHCR_PULL_TOKEN"; missing=1; }
          if [[ "$missing" -ne 0 ]]; then
            echo "Add secrets under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy to ${{ matrix.server.host }}
        env:
          DEPLOY_HOST: ${{ matrix.server.host }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          KEY_FILE=~/.ssh/deploy_key
          echo "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if ! ssh-keygen -y -f "$KEY_FILE" > /dev/null 2>&1; then
            echo "ERROR: DEPLOY_SSH_KEY is invalid."
            exit 1
          fi

          PORT="${DEPLOY_PORT:-22}"
          PATH_ON_SERVER="${DEPLOY_PATH:-/opt/durpalla-apigw}"
          GHCR_TOKEN_B64="$(printf '%s' "$GHCR_TOKEN" | base64 -w0 2>/dev/null || printf '%s' "$GHCR_TOKEN" | base64)"

          SSH_COMMON=(
            -i "$KEY_FILE"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o IdentitiesOnly=yes
            -o TCPKeepAlive=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=40
          )

          echo "Deploying to ${DEPLOY_USER}@${DEPLOY_HOST}:${PORT} (${PATH_ON_SERVER})"

          REMOTE_DIR="/tmp/durpalla-apigw-deploy-$$"
          ssh "${SSH_COMMON[@]}" -p "$PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${REMOTE_DIR}'"

          scp "${SSH_COMMON[@]}" -P "$PORT" \
            script/ci-deploy-remote.sh \
            script/normalize-docker-env.sh \
            script/docker-host-gateway.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/"

          ssh "${SSH_COMMON[@]}" -p "$PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "export DEPLOY_PATH='${PATH_ON_SERVER}' IMAGE='${IMAGE}' GHCR_TOKEN_B64='${GHCR_TOKEN_B64}' GHCR_USER='${GHCR_USER}' DEPLOY_SCRIPT_DIR='${REMOTE_DIR}'; bash '${REMOTE_DIR}/ci-deploy-remote.sh'; rm -rf '${REMOTE_DIR}'"

      - name: Deploy summary
        run: |
          echo "### Deployed to ${{ matrix.server.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Host: \`${{ matrix.server.host }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- Note: CI deploys containers only (no nginx/SSL changes)" >> $GITHUB_STEP_SUMMARY

  smoke-test:
    name: Public health check
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Check https://apigw.durpalla.com/up
        run: |
          set -euo pipefail
          URL="${APIGW_HEALTH_URL:-https://apigw.durpalla.com/up}"
          echo "Checking ${URL} ..."
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 30 "$URL" || echo 000)"
            if [[ "$code" -ge 200 && "$code" -lt 400 ]]; then
              echo "OK HTTP ${code}"
              echo "### Public smoke test passed (HTTP ${code})" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            echo "Attempt ${attempt}/5: HTTP ${code}, retrying in 10s..."
            sleep 10
          done
          echo "::warning::Public health check failed (last HTTP ${code}). Containers may be OK — check Cloudflare DNS/SSL and host nginx."
          echo "### Public smoke test warning (HTTP ${code})" >> $GITHUB_STEP_SUMMARY
          echo "Deploy may have succeeded on servers; verify nginx/Cloudflare if the site still returns 500." >> $GITHUB_STEP_SUMMARY
          exit 0
