name: CI — Build & Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Do not cancel the whole workflow on a newer push — that aborted mid-roll
# deploys and left mixed old/new containers behind Cloudflare.
concurrency:
  group: deploy-apigw-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    # Safe to cancel a superseded image build; deploy jobs below never cancel.
    concurrency:
      group: build-apigw-image-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_ref: ${{ steps.image.outputs.ref }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Must match the GitHub repo owner (Durpalla/…), not a personal jewel-rana namespace —
      # GITHUB_TOKEN cannot push packages under another user → 403 on ghcr.io.
      - name: Normalize GHCR image coordinates
        id: image
        shell: bash
        run: |
          echo "ref=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=dev-{{date 'YYYYMMDD'}}-{{sha}},enable=true
            type=raw,value=dev-latest,enable=true
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.image.outputs.owner }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "### Image pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.REGISTRY }}/${{ steps.image.outputs.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | ${{ steps.build.outputs.digest }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to ${{ matrix.server.name }}
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        server:
          - name: server-94
            host: 103.60.204.94
          - name: server-238
            host: 103.60.204.238

    # Never cancel an in-flight host deploy — that left mixed old/new
    # durpalla-apigw-{1..4} images and intermittent trip/500 responses.
    concurrency:
      group: deploy-apigw-${{ github.ref }}-${{ matrix.server.host }}
      cancel-in-progress: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          missing=0
          [[ -n "${{ secrets.DEPLOY_USER }}" ]] || { echo "::error::Missing secret DEPLOY_USER"; missing=1; }
          [[ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]] || { echo "::error::Missing secret DEPLOY_SSH_KEY"; missing=1; }
          [[ -n "${{ secrets.GHCR_PULL_TOKEN }}" ]] || { echo "::error::Missing secret GHCR_PULL_TOKEN"; missing=1; }
          if [[ "$missing" -ne 0 ]]; then
            echo "Add secrets under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # Unreachable host fails this matrix leg (and the workflow via deploy-gate).
      - name: Require SSH reachability
        env:
          DEPLOY_HOST: ${{ matrix.server.host }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"

          for attempt in 1 2 3; do
            if timeout 15 bash -c "cat < /dev/null > /dev/tcp/${DEPLOY_HOST}/${PORT}" 2>/dev/null; then
              echo "${DEPLOY_HOST}:${PORT} is reachable (attempt ${attempt})."
              exit 0
            fi
            echo "Attempt ${attempt}/3: no TCP connection to ${DEPLOY_HOST}:${PORT}."
            if [[ "$attempt" -lt 3 ]]; then
              sleep 10
            fi
          done

          echo "::error::${{ matrix.server.name }} (${DEPLOY_HOST}:${PORT}) unreachable — deploy failed."
          exit 1

      - name: Deploy to ${{ matrix.server.host }}
        id: deploy
        env:
          DEPLOY_HOST: ${{ matrix.server.host }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Digest pin — never deploy a floating :dev-latest that another push retagged.
          IMAGE: ${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image_ref }}@${{ needs.build-and-push.outputs.image_digest }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          KEY_FILE=~/.ssh/deploy_key
          echo "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if ! ssh-keygen -y -f "$KEY_FILE" > /dev/null 2>&1; then
            echo "ERROR: DEPLOY_SSH_KEY is invalid."
            exit 1
          fi

          PORT="${DEPLOY_PORT:-22}"
          PATH_ON_SERVER="${DEPLOY_PATH:-/opt/durpalla-apigw}"
          GHCR_TOKEN_B64="$(printf '%s' "$GHCR_TOKEN" | base64 -w0 2>/dev/null || printf '%s' "$GHCR_TOKEN" | base64)"

          SSH_COMMON=(
            -i "$KEY_FILE"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o IdentitiesOnly=yes
            -o ConnectTimeout=20
            -o TCPKeepAlive=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=40
          )

          echo "Deploying to ${DEPLOY_USER}@${DEPLOY_HOST}:${PORT} (${PATH_ON_SERVER})"
          echo "Image: ${IMAGE}"

          REMOTE_DIR="/tmp/durpalla-apigw-deploy-$$"
          ssh "${SSH_COMMON[@]}" -p "$PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${REMOTE_DIR}'"

          scp "${SSH_COMMON[@]}" -P "$PORT" \
            script/ci-deploy-remote.sh \
            script/ci-verify-remote.sh \
            script/normalize-docker-env.sh \
            script/docker-host-gateway.sh \
            script/seed-passport-keys-volume.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_DIR}/"

          ssh "${SSH_COMMON[@]}" -p "$PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "export DEPLOY_PATH='${PATH_ON_SERVER}' IMAGE='${IMAGE}' GHCR_TOKEN_B64='${GHCR_TOKEN_B64}' GHCR_USER='${GHCR_USER}' DEPLOY_SCRIPT_DIR='${REMOTE_DIR}'; bash '${REMOTE_DIR}/ci-deploy-remote.sh'"

          # Second independent gate over SSH — must match the digest we just deployed.
          ssh "${SSH_COMMON[@]}" -p "$PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "EXPECTED_IMAGE_ID=\$(docker image inspect -f '{{.Id}}' '${IMAGE}') bash '${REMOTE_DIR}/ci-verify-remote.sh'; rm -rf '${REMOTE_DIR}'"

      - name: Deploy summary
        if: always()
        run: |
          echo "### ${{ matrix.server.name }} → ${{ matrix.server.host }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ env.REGISTRY }}/${{ needs.build-and-push.outputs.image_ref }}@${{ needs.build-and-push.outputs.image_digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: \`${{ steps.deploy.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-gate:
    name: All servers must succeed
    needs: deploy
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/master'
    steps:
      - name: Fail workflow when any host deploy failed
        run: |
          set -euo pipefail
          result="${{ needs.deploy.result }}"
          echo "## Apigw multi-server deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Matrix deploy result: \`${result}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "| Server |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 103.60.204.94 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 103.60.204.238 |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$result" != "success" ]]; then
            echo "::error::Deploy failed on at least one server (result=${result}). Treating build as failed."
            exit 1
          fi
          echo "All apigw servers deployed successfully."

  smoke-test:
    name: Public health check
    needs: [deploy, deploy-gate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && needs.deploy-gate.result == 'success'

    steps:
      - name: Check https://apigw.durpalla.com/up
        run: |
          set -euo pipefail
          URL="${APIGW_HEALTH_URL:-https://apigw.durpalla.com/up}"
          echo "Checking ${URL} ..."
          for attempt in 1 2 3 4 5; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 30 "$URL" || echo 000)"
            if [[ "$code" -ge 200 && "$code" -lt 400 ]]; then
              echo "OK HTTP ${code}"
              echo "### Public smoke test passed (HTTP ${code})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt ${attempt}/5: HTTP ${code}, retrying in 10s..."
            sleep 10
          done
          echo "::warning::Public /up failed (last HTTP ${code}). Reachable hosts may still be OK — check Cloudflare / nginx."
          echo "### Public smoke test warning (HTTP ${code})" >> "$GITHUB_STEP_SUMMARY"
          exit 0
