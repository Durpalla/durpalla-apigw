name: CI — Server Build & Deploy

# Fire-and-forget: GitHub only SSHs, drops scripts, starts nohup on the server, exits.
# Docker build + container roll run on the VPS — almost no Actions minutes.

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-apigw-server-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger build on ${{ matrix.server.name }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Both hosts can be kicked off in parallel; each builds on its own CPU.
      max-parallel: 2
      matrix:
        server:
          - name: server-94
            host: 103.60.204.94
          - name: server-238
            host: 103.60.204.238

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            script
          sparse-checkout-cone-mode: true

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          missing=0
          [[ -n "${{ secrets.DEPLOY_USER }}" ]] || { echo "::error::Missing secret DEPLOY_USER"; missing=1; }
          [[ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]] || { echo "::error::Missing secret DEPLOY_SSH_KEY"; missing=1; }
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Require SSH reachability
        env:
          DEPLOY_HOST: ${{ matrix.server.host }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          for attempt in 1 2 3; do
            if timeout 15 bash -c "cat < /dev/null > /dev/tcp/${DEPLOY_HOST}/${PORT}" 2>/dev/null; then
              echo "${DEPLOY_HOST}:${PORT} reachable"
              exit 0
            fi
            sleep 5
          done
          echo "::error::${{ matrix.server.name }} unreachable"
          exit 1

      - name: Start server build (async) & exit
        id: trigger
        env:
          DEPLOY_HOST: ${{ matrix.server.host }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_GIT_SSH_KEY: ${{ secrets.DEPLOY_GIT_SSH_KEY }}
          DEPLOY_GIT_TOKEN: ${{ secrets.DEPLOY_GIT_TOKEN || secrets.GHCR_PUSH_TOKEN || github.token }}
          GIT_SHA: ${{ github.sha }}
          GIT_REPO_OVERRIDE: ${{ secrets.DEPLOY_GIT_REPO }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          KEY_FILE=~/.ssh/deploy_key
          echo "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ssh-keygen -y -f "$KEY_FILE" > /dev/null

          PORT="${DEPLOY_PORT:-22}"
          PATH_ON_SERVER="${DEPLOY_PATH:-/opt/durpalla-apigw}"
          RUNNER_DIR="${PATH_ON_SERVER}/ci-runner"
          SCRIPTS_DIR="${RUNNER_DIR}/scripts"

          GIT_SSH_KEY_B64=""
          GIT_TOKEN=""
          GIT_REPO=""

          if [[ -n "${DEPLOY_GIT_SSH_KEY:-}" ]]; then
            GIT_REPO="${GIT_REPO_OVERRIDE:-git@github.com:${GITHUB_REPOSITORY}.git}"
            GIT_SSH_KEY_B64="$(printf '%s' "$DEPLOY_GIT_SSH_KEY" | base64 -w0 2>/dev/null || printf '%s' "$DEPLOY_GIT_SSH_KEY" | base64)"
            echo "Git mode: SSH deploy key"
          else
            GIT_REPO="${GIT_REPO_OVERRIDE:-https://github.com/${GITHUB_REPOSITORY}.git}"
            if [[ "$GIT_REPO" == git@* ]]; then
              path="${GIT_REPO#git@github.com:}"
              GIT_REPO="https://github.com/${path}"
            fi
            GIT_TOKEN="${DEPLOY_GIT_TOKEN:-}"
            [[ -n "$GIT_TOKEN" ]] || { echo "ERROR: no git token"; exit 1; }
            echo "Git mode: HTTPS + token"
          fi

          SSH_COMMON=(
            -i "$KEY_FILE"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o IdentitiesOnly=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=5
            -o ServerAliveCountMax=3
          )

          echo "Trigger → ${DEPLOY_USER}@${DEPLOY_HOST} sha=${GIT_SHA}"

          ssh "${SSH_COMMON[@]}" -p "$PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${SCRIPTS_DIR}' '${RUNNER_DIR}'"

          scp "${SSH_COMMON[@]}" -P "$PORT" \
            script/ci-build-deploy-remote.sh \
            script/ci-deploy-remote.sh \
            script/ci-verify-remote.sh \
            script/ci-notify-email.sh \
            script/ci-notify-email.php \
            script/normalize-docker-env.sh \
            script/docker-host-gateway.sh \
            script/seed-passport-keys-volume.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${SCRIPTS_DIR}/"

          {
            echo "DEPLOY_PATH=${PATH_ON_SERVER}"
            echo "GIT_SHA=${GIT_SHA}"
            echo "GIT_REPO=${GIT_REPO}"
            echo "DEPLOY_SCRIPT_DIR=${SCRIPTS_DIR}"
            echo "STATUS_DIR=${RUNNER_DIR}"
            echo "DEPLOY_NOTIFY_EMAIL=jewelrana.dev@gmail.com"
            if [[ -n "$GIT_TOKEN" ]]; then
              printf 'GIT_TOKEN=%s\n' "$GIT_TOKEN"
            fi
            if [[ -n "$GIT_SSH_KEY_B64" ]]; then
              printf 'GIT_SSH_KEY_B64=%s\n' "$GIT_SSH_KEY_B64"
            fi
          } > /tmp/apigw-deploy.env

          scp "${SSH_COMMON[@]}" -P "$PORT" \
            /tmp/apigw-deploy.env \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${RUNNER_DIR}/deploy.env"
          rm -f /tmp/apigw-deploy.env

          # Start build detached; SSH returns immediately (no wait for docker build).
          ssh "${SSH_COMMON[@]}" -p "$PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x '${SCRIPTS_DIR}'/*.sh && \
             printf 'state=queued\nsha=${GIT_SHA}\nqueued_at=%s\n' \"\$(date -u +%Y-%m-%dT%H:%M:%SZ)\" > '${RUNNER_DIR}/status' && \
             nohup bash -c 'set -a; . \"${RUNNER_DIR}/deploy.env\"; set +a; \
               exec >>\"${RUNNER_DIR}/deploy.log\" 2>&1; \
               echo \"==== \$(date -u +%Y-%m-%dT%H:%M:%SZ) sha=${GIT_SHA} ====\"; \
               bash \"${SCRIPTS_DIR}/ci-build-deploy-remote.sh\"; \
               echo exit:\$?' \
               </dev/null >/dev/null 2>&1 & \
             echo \$! > '${RUNNER_DIR}/deploy.pid'; \
             echo TRIGGERED pid=\$(cat '${RUNNER_DIR}/deploy.pid') log=${RUNNER_DIR}/deploy.log"

          echo "### ${{ matrix.server.name }} → ${{ matrix.server.host }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: **async** server build (GitHub does not wait)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Follow on server: \`tail -f ${PATH_ON_SERVER:-/opt/durpalla-apigw}/ci-runner/deploy.log\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status file: \`${PATH_ON_SERVER:-/opt/durpalla-apigw}/ci-runner/status\`" >> "$GITHUB_STEP_SUMMARY"

  trigger-gate:
    name: All hosts triggered
    needs: trigger
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/master'
    steps:
      - name: Confirm triggers
        run: |
          set -euo pipefail
          result="${{ needs.trigger.result }}"
          echo "Trigger matrix result: \`${result}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$result" != "success" ]]; then
            echo "::error::Failed to start server build on at least one host."
            exit 1
          fi
          echo "Builds are running on the servers. GitHub job is done — watch server logs for finish."
          echo "OK — async deploys started (build continues on VPS)."
